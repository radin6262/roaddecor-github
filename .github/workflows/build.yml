name: Build and Release

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Release type'
        required: true
        default: 'draft'
        type: choice
        options:
          - draft
          - publish
      version:
        description: 'Version (leave empty to use gradle.properties)'
        required: false
        default: ''
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      jar_name: ${{ steps.get_jar.outputs.jar_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Get Version
        id: get_version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION=$(grep "^mod_version=" gradle.properties | cut -d'=' -f2)
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Found version: $VERSION"

      - name: Run Datagen
        run: ./gradlew runData

      - name: Build with Gradle
        run: ./gradlew build

      - name: Find JAR file
        id: get_jar
        run: |
          JAR_FILE=$(ls build/libs/roaddecor-*.jar | head -1)
          echo "jar_name=$(basename $JAR_FILE)" >> $GITHUB_OUTPUT
          echo "JAR file: $JAR_FILE"

      - name: Upload JAR as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: roaddecor-${{ steps.get_version.outputs.version }}
          path: build/libs/roaddecor-*.jar
          retention-days: 30

      - name: Create Draft Release
        if: inputs.release_type == 'draft'
        uses: softprops/action-gh-release@v1
        with:
          name: Road Decor v${{ steps.get_version.outputs.version }}
          tag_name: v${{ steps.get_version.outputs.version }}
          body: |
            Drafted - autobuild
          draft: true
          prerelease: false
          files: |
            build/libs/roaddecor-*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Published Release
        if: inputs.release_type == 'publish'
        uses: softprops/action-gh-release@v1
        with:
          name: Road Decor v${{ steps.get_version.outputs.version }}
          tag_name: v${{ steps.get_version.outputs.version }}
          body: |
            Drafted - autobuild
          draft: false
          prerelease: false
          files: |
            build/libs/roaddecor-*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}