name: Build and Release

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Release type'
        required: true
        default: 'draft'
        type: choice
        options:
          - draft
          - publish

      version:
        description: 'Version (leave empty to use gradle.properties)'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.get_version.outputs.version }}
      jar_name: ${{ steps.get_jar.outputs.jar_name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Get Version
        id: get_version
        shell: bash
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION=$(grep "^mod_version=" gradle.properties | cut -d'=' -f2)
          fi

          # Remove a leading "v" if one was provided.
          VERSION="${VERSION#v}"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Found version: $VERSION"

      - name: Run Datagen
        run: ./gradlew runData

      - name: Build with Gradle
        run: ./gradlew build

      - name: Find JAR file
        id: get_jar
        shell: bash
        run: |
          JAR_FILE=$(find build/libs -maxdepth 1 -type f -name 'roaddecor-*.jar' | head -n 1)

          if [ -z "$JAR_FILE" ]; then
            echo "No Road Decor JAR found!"
            exit 1
          fi

          echo "jar_name=$(basename "$JAR_FILE")" >> "$GITHUB_OUTPUT"
          echo "JAR file: $JAR_FILE"

      - name: Upload JAR as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: roaddecor-${{ steps.get_version.outputs.version }}
          path: build/libs/roaddecor-*.jar
          retention-days: 30

      - name: Create Draft Release
        if: inputs.release_type == 'draft'
        uses: softprops/action-gh-release@v2
        with:
          name: Road Decor v${{ steps.get_version.outputs.version }}
          tag_name: v${{ steps.get_version.outputs.version }}
          body: |
            ## Road Decor v${{ steps.get_version.outputs.version }}

            Automated draft release.

            ### Requirements
            - Minecraft 1.21.1
            - NeoForge 21.1.244+

            This release was automatically built by GitHub Actions.
          draft: true
          prerelease: false
          files: |
            build/libs/roaddecor-*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Published Release
        if: inputs.release_type == 'publish'
        uses: softprops/action-gh-release@v2
        with:
          name: Road Decor v${{ steps.get_version.outputs.version }}
          tag_name: v${{ steps.get_version.outputs.version }}
          body: |
            ## Road Decor v${{ steps.get_version.outputs.version }}

            Automated release.

            ### Requirements
            - Minecraft 1.21.1
            - NeoForge 21.1.244+

            This release was automatically built by GitHub Actions.
          draft: false
          prerelease: false
          files: |
            build/libs/roaddecor-*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}